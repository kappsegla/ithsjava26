# This workflow builds a custom JRE using jlink for HelloWorld and packages
# runnable distributions for Windows, Linux, and macOS.

name: Build Custom JRE Distribution

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-distribution:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive-ext: tar.gz
          - os: windows-latest
            platform: windows
            archive-ext: zip
#          - os: macos-latest
#            platform: mac
#            archive-ext: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 27
      uses: actions/setup-java@v6
      with:
        java-version: '27'
        distribution: 'temurin'
        cache: maven

    - name: Build JAR with Maven
      run: mvn -B package -DskipTests --file pom.xml

    - name: Find JAR file (Linux/Mac)
      if: matrix.os != 'windows-latest'
      id: find-jar-linux
      run: |
        JAR=$(ls target/*.jar | head -1)
        echo "jar_path=$JAR" >> $GITHUB_OUTPUT
        echo "Found JAR: $JAR"

    - name: Analyze dependencies with jdeps (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: |
        JAR=${{ steps.find-jar-linux.outputs.jar_path }}
        jdeps --print-module-deps "$JAR" > modules.txt
        cat modules.txt

    - name: Build custom JRE with jlink (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: |
        JAR=${{ steps.find-jar-linux.outputs.jar_path }}
        MODULES=$(jdeps --print-module-deps "$JAR")
        jlink --add-modules "$MODULES" \
              --output jre \
              --strip-debug

    - name: Find JAR file (Windows)
      if: matrix.os == 'windows-latest'
      id: find-jar-windows
      shell: pwsh
      run: |
        $jar = Get-ChildItem target\*.jar | Select-Object -First 1
        echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
        echo "Found JAR: $($jar.FullName)"

    - name: Analyze dependencies with jdeps (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $jar = '${{ steps.find-jar-windows.outputs.jar_path }}'
        jdeps --print-module-deps "$jar" | Out-File -FilePath modules.txt
        Get-Content modules.txt

    - name: Build custom JRE with jlink (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $jar = '${{ steps.find-jar-windows.outputs.jar_path }}'
        $modules = jdeps --print-module-deps "$jar"
        jlink --add-modules "$modules" --output jre --strip-debug

    - name: Create distribution (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: |
        JAR=${{ steps.find-jar-linux.outputs.jar_path }}
        JAR_NAME=$(basename "$JAR")
        mkdir -p dist/helloworld
        cp "$JAR" dist/helloworld/
        cp -r jre dist/helloworld/
        cat > dist/helloworld/run.sh << EOF
        #!/bin/bash
        DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        "\$DIR/jre/bin/java" -jar "\$DIR/$JAR_NAME" "\$@"
        EOF
        chmod +x dist/helloworld/run.sh
        cd dist && tar -czf "helloworld-${{ matrix.platform }}.tar.gz" helloworld/

    - name: Create distribution (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $jar = '${{ steps.find-jar-windows.outputs.jar_path }}'
        $jarName = Split-Path $jar -Leaf
        New-Item -ItemType Directory -Path dist\helloworld -Force
        Copy-Item "$jar" dist\helloworld\
        Copy-Item -Recurse jre dist\helloworld\
        @"
        @echo off
        setlocal
        set "DIR=%~dp0"
        "%DIR%jre\bin\java.exe" -jar "%DIR%$jarName" %*
        "@ | Out-File -FilePath dist\helloworld\run.bat -Encoding ASCII
        Set-Location dist
        Compress-Archive -Path helloworld -DestinationPath "helloworld-${{ matrix.platform }}.zip"

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: dist/helloworld-${{ matrix.platform }}.${{ matrix.archive-ext }}
        fail_on_unmatched_files: false
